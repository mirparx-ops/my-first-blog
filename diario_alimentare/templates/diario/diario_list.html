<html>
    <head><h1>Diario Alimentare</h1>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
    </head>
    <body>
         {% for pasto in pasti %}
            
        <article>
            <time>Data : {{pasto.data}}  - Ora : {{pasto.orario}} </time>
            <h3><a href="">Titolo : {{pasto.title}}</a></h3>
            <p>Sitauzione : {{pasto.situazione}}</p>
            <p>Cibo : {{pasto.cibo}}</p>
            <p>Sensazione : {{pasto.sensazione}}</p>
        </article>
        {% endfor %}


    </body>
</html>
